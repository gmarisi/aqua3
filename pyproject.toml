[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aqua3"
version = "0.2.0"
description = "Python port of AQuA2 with a modern desktop GUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "tifffile>=2023.7",
  "pyside6>=6.6"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aqua3 = "aqua3.__main__:main"

[project.gui-scripts]
aqua3-gui = "aqua3.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
